#ConfigurationIngres� tu correo electr�nico para reenviar el enlace de verificaci�n.
spring.application.name=carpool
server.servlet.context-path=/carpool/api/v1
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

#Database
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto= update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql= true

#Liquibase
spring.liquibase.change-log=classpath:changelog/db.changelog-master.xml
spring.liquibase.enabled=true
spring.liquibase.drop-first=false

#Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=6379

#Google
google.client-id=${GOOGLE_CLIENT_ID}
redirect.validate.email=${FRONTEND_BASE_URL}/api/users/activate-account?token=value
google.api.key=${GOOGLE_API_KEY}
google.credentials.json=${GOOGLE_CREDENTIALS_JSON}

#Password Change
redirect.password.change=${FRONTEND_BASE_URL}/password-change?token=value

#Email update
redirect.email.change = ${FRONTEND_BASE_URL}/email-update?token=value

#Pay Reservation
redirect.pay.reservation = ${FRONTEND_BASE_URL}/debt

#Ver solicitud
redirect.view.reservation = ${FRONTEND_BASE_URL}/reservations/{value}

#Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=argcarpool@gmail.com
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#Unlock account url
unlock.account.url=${FRONTEND_BASE_URL}/unlock-account?token=value

#Recaptcha
recaptcha.verifyUrl=https://www.google.com/recaptcha/api/siteverify
recaptcha.secretKey=${RECAPTCHA_SECRET_KEY}

#Cloudflare R2
cloudflare.r2.endpoint=https://5dce6dd8fd2b8c12742c81bbb251a9ca.r2.cloudflarestorage.com
cloudflare.r2.public.endpoint=https://pub-15165322192045ea9751c967a7ea3853.r2.dev/
cloudflare.r2.bucket-private=carpool-media
cloudflare.r2.bucket-public=carpool-app
cloudflare.r2.access-key=${CLOUDFLARE_R2_ACCESS_KEY}
cloudflare.r2.secret-key=${CLOUDFLARE_R2_SECRET_KEY}

logging.level.org.springframework.messaging=DEBUG
logging.level.org.springframework.web.socket=DEBUG
