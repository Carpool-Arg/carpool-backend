<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title th:utext="${title}"></title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    @media only screen and (max-width: 600px) {
      .container {
        width: 95% !important;
        padding: 20px !important;
      }
      .button {
        width: 100% !important;
        text-align: center !important;
        box-sizing: border-box !important;
      }
    }
  </style>
</head>
<body style="Margin:0;padding:0;background-color:#f4f4f4;font-family:Arial,sans-serif;">
<center style="width:100%;background-color:#f4f4f4;">
  <table width="100%" border="0" cellspacing="0" cellpadding="0">
    <tr>
      <td align="center" style="padding:20px 10px;">
        <table class="container" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.05);max-width:600px;width:100%;">
          <tr>
            <td style="padding:30px;">
              <!-- Logo -->
              <img src="https://i.imgur.com/EzBjalg.png" alt="Carpool" width="48" height="48" style="display:block;margin-bottom:20px;">

              <!-- Título -->
              <h2 style="font-size:22px;margin:0 0 10px 0;color:#111;" th:utext="${title}"></h2>

              <!-- Mensaje -->
              <p style="font-size:15px;line-height:1.6;color:#333;margin-bottom:30px;" th:utext="${message}"></p>

              <!-- Mensaje opcional -->
              <p style="font-size:15px;line-height:1.6;color:#333;margin-bottom:30px;" th:utext="${optionalMessage}"></p>

              <!-- Botón -->
              <div th:if="${buttonUrl != null}" style="margin-bottom:30px;">
                <a class="button" th:href="${buttonUrl}" th:text="${buttonText}"
                   style="background-color:#0066ff;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:6px;font-weight:bold;font-size:14px;display:inline-block;text-align:center;min-width:120px;box-sizing:border-box;">
                </a>
              </div>

              <!-- Separador -->
              <hr style="border:none;border-top:1px solid #eee;margin:30px 0;">

              <!-- Footer -->
              <p style="font-size:13px;color:#999;margin:0;" th:utext="${messageFooter}">
                <!--<a href="#" style="color:#bbb;text-decoration:none;"></a>-->
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</center>
</body>
</html>
