<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Default title</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f9f9f9;">
<table role="presentation" style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
    <tr>
        <td style="padding: 30px;">
            <!-- Logo carpool -->
            <img src="https://i.imgur.com/IdyKvWZ.png" alt="Logo" width="40" height="40" style="display: block; margin-bottom: 20px;">

            <h2 style="font-size: 22px; color: #111; margin: 0 0 10px 0;" th:text="${subject}">Default subject</h2>

            <p style="font-size: 15px; line-height: 1.6; color: #333; margin: 0 0 30px;" th:text="${message}">
               Default message
            </p>

            <div th:if="${buttonUrl != null}">
                <a th:href="${buttonUrl}" th:text="${buttonText}"
                   style="background-color: #0066ff; color: white; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px; display: inline-block; margin-bottom: 10px;">
                    Button
                </a>
            </div>

            <hr style="border: none; border-top: 1px solid #eee; margin: 30px 0;">

            <p style="font-size: 13px; color: #999;">
                <strong>Stroopwafel</strong> &nbsp;
                <a href="#" style="color: #bbb; text-decoration: none;">Unsubscribe from these emails</a>
            </p>
        </td>
    </tr>
</table>
</body>
</html>
